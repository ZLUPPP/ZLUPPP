  <text x="28" y="79" class="title">LEETCODE MONTHLY CLIMB</text>
  <text x="872" y="79" class="label dim" text-anchor="end">OCTOBER 2026</text>
  <text x="28" y="119" class="big">0 / 31</text>
  <text x="872" y="116" class="percent" text-anchor="end">0.0%</text>
  <text x="28" y="145" class="label" fill="#8b949e">31 PROBLEMS TO SUMMIT</text>

  
