<svg width="900" height="470" viewBox="0 0 900 470"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 2;
    }

    .text {
      font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
      font-size: 18px;
      fill: #c9d1d9;
    }

    .green { fill: #3fb950; }
    .blue  { fill: #58a6ff; }
    .dim   { fill: #8b949e; }

    .hello {
      font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
      font-size: 44px;
      font-weight: 700;
      fill: #F71F6DFF;
      opacity: 0;
      animation: show 0.35s ease 6.3s forwards;
    }

    .line1 { opacity: 0; animation: show 0.3s ease 6.45s forwards; }
    .line2 { opacity: 0; animation: show 0.3s ease 6.60s forwards; }
    .line3 { opacity: 0; animation: show 0.3s ease 6.75s forwards; }
    .line4 { opacity: 0; animation: show 0.3s ease 6.90s forwards; }

    .finalPrompt {
      opacity: 0;
      animation: show 0.25s ease 7.1s forwards;
    }

    .cursor {
      animation: blink 0.9s step-end infinite;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 45%   { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    .scanline {
      fill: #ffffff;
      opacity: 0.018;
      animation: scan 7s linear infinite;
    }

    @keyframes scan {
      from { transform: translateY(-470px); }
      to   { transform: translateY(470px); }
    }
  </style>

  <!-- Terminal window -->
  <rect x="10" y="10" width="880" height="450" rx="12" class="bg"/>

  <!-- Window buttons -->
  <circle cx="35" cy="35" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="35" r="7" fill="#ffbd2e"/>
  <circle cx="81" cy="35" r="7" fill="#27c93f"/>

  <!-- Window title -->
  <text x="450" y="41"
        text-anchor="middle"
        class="text dim"
        font-size="14">
    ZLUPPP@github
  </text>

  <!-- Prompt -->
  <text x="40" y="90" class="text">
    <tspan class="green">ZLUPPP</tspan>
    <tspan class="dim">@github</tspan>
    <tspan>:</tspan>
    <tspan class="blue">~$</tspan>
  </text>

  <!-- Dynamic Typing & Backspace Animation -->
  <g class="text">
    <!-- ./hel -->
    <text x="259" y="90" opacity="0">.<animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.01s" fill="freeze"/></text>
    <text x="270" y="90" opacity="0">/<animate attributeName="opacity" from="0" to="1" begin="2.65s" dur="0.01s" fill="freeze"/></text>
    <text x="281" y="90" opacity="0">h<animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.01s" fill="freeze"/></text>
    <text x="292" y="90" opacity="0">e<animate attributeName="opacity" from="0" to="1" begin="2.95s" dur="0.01s" fill="freeze"/></text>
    <text x="303" y="90" opacity="0">l<animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.01s" fill="freeze"/></text>

    <!-- Typos: "ol" -->
    <text x="314" y="90" opacity="0">
      o
      <animate attributeName="opacity" from="0" to="1" begin="3.25s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" begin="4.1s" dur="0.01s" fill="freeze"/>
    </text>
    <text x="325" y="90" opacity="0">
      l
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" begin="3.95s" dur="0.01s" fill="freeze"/>
    </text>

    <!-- Pause & Correction: "lo.sh" -->
    <text x="314" y="90" opacity="0">l<animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.01s" fill="freeze"/></text>
    <text x="325" y="90" opacity="0">o<animate attributeName="opacity" from="0" to="1" begin="4.55s" dur="0.01s" fill="freeze"/></text>
    <text x="336" y="90" opacity="0">.<animate attributeName="opacity" from="0" to="1" begin="4.7s" dur="0.01s" fill="freeze"/></text>
    <text x="347" y="90" opacity="0">s<animate attributeName="opacity" from="0" to="1" begin="4.85s" dur="0.01s" fill="freeze"/></text>
    <text x="358" y="90" opacity="0">h<animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.01s" fill="freeze"/></text>

    <!-- Animated Cursor -->
    <text x="259" y="90">█<animate 
    attributeName="x"
    calcMode="discrete"
    values="259;270;281;292;303;314;325;336;325;314;325;336;347;358;369"
    keyTimes="0;0.125;0.1625;0.2;0.2375;0.275;0.3125;0.45;0.4875;0.525;0.6;0.6375;0.675;0.7125;0.75"
    begin="2.0s"
    dur="4.0s" 
    fill="freeze" />
    <animate 
    attributeName="opacity" 
    values="1;0;1;0;1" 
    keyTimes="0;0.25;0.5;0.75;1" 
    calcMode="discrete" 
    begin="0s" 
    dur="2.0s" 
    fill="freeze" />
    <animate 
    attributeName="opacity" 
    from="1" 
    to="0" 
    begin="5.7s" 
    dur="0.05s" 
    fill="freeze" /></text>
  </g>

  <!-- HELLO THERE -->
  <text x="450" y="165" text-anchor="middle" class="hello">
    HELLO THERE!
  </text>

  <!-- Output Lines -->
  <text x="70" y="215" class="text line1">
    <tspan class="blue">&gt;</tspan>
    <tspan>👨‍🎓 Ilya Sachkov</tspan>
  </text>

  <text x="70" y="255" class="text line2">
    <tspan class="blue">&gt;</tspan>
    <tspan>🎓 Software Engineering Student @ KBTU</tspan>
  </text>

  <text x="70" y="295" class="text line3">
    <tspan class="blue">&gt;</tspan>
    <tspan>🏫 School of Information Technology and Engineering (SITE)</tspan>
  </text>

  <text x="70" y="335" class="text line4">
    <tspan class="blue">&gt;</tspan>
    <tspan>🛠️ Backend • Data Engineering • DevOps • Linux</tspan>
  </text>

  <!-- New prompt -->
  <text x="40" y="400" class="text finalPrompt">
    <tspan class="green">ZLUPPP</tspan>
    <tspan class="dim">@github</tspan>
    <tspan>:</tspan>
    <tspan class="blue">~$</tspan>
    <tspan> </tspan>
    <tspan class="cursor">█</tspan>
  </text>

  <!-- CRT scanline -->
  <rect x="11" y="-460" width="878" height="80" class="scanline"/>
</svg>
