name: Update LeetCode Monthly Climb

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate progress card
        run: python scripts/leetcode_progress.py

      - name: Commit the changed SVG
        run: |
          if git diff --quiet -- assets/leetcode-progress.svg; then
            echo "Progress card is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-progress.svg
          git commit -m "chore: update LeetCode monthly progress"
          git push
