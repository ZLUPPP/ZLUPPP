name: Update Random Waifu

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Almaty"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-waifu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get random waifu
        run: |
            mkdir -p assets

            USER_AGENT="UnDeCaryGitHubProfile (https://github.com/${{ github.repository }})"

            RESPONSE=$(curl -fsS \
            --retry 3 \
            -H "User-Agent: $USER_AGENT" \
            "https://nekos.best/api/v2/waifu")

            IMAGE_URL=$(echo "$RESPONSE" | jq -er '.results[0].url')

            echo "Downloading: $IMAGE_URL"

            curl -fL \
            --retry 3 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: image/*" \
            "$IMAGE_URL" \
            -o /tmp/waifu.png

            FILE_TYPE=$(file --mime-type -b /tmp/waifu.png)
            echo "Downloaded MIME type: $FILE_TYPE"

            if [[ "$FILE_TYPE" != image/* ]]; then
            echo "ERROR: API returned something that is not an image"
            head -c 300 /tmp/waifu.png
            exit 1
            fi

            mv /tmp/waifu.png assets/waifu.png

      - name: Commit new waifu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/waifu.png

          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi

          git commit -m "chore: update random waifu"
          git push