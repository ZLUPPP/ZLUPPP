name: Update Random Waifu

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Almaty"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-waifu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate waifu SVG card
        run: python scripts/random_waifu.py

      - name: Update Cache-Buster in README
        run: |
            TIMESTAMP=$(date +%s)
            sed -i -E "s|(assets/random-waifu\.svg\?v=)[0-9]+|\1$TIMESTAMP|g" README.md

      - name: Commit new waifu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/random-waifu.*

          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi

          git commit -m "chore: update random waifu"
          git push